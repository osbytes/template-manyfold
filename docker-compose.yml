services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-manyfold}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-manyfold_dev}
      POSTGRES_DB: ${DATABASE_NAME:-manyfold}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-manyfold} -d ${DATABASE_NAME:-manyfold}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ./services/app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3214}:3214"
    environment:
      PORT: "3214"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      REDIS_URL: redis://redis:6379/1
      DATABASE_ADAPTER: postgresql
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-manyfold}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-manyfold_dev}
      DATABASE_NAME: ${DATABASE_NAME:-manyfold}
      MULTIUSER: ${MULTIUSER:-enabled}
      HTTPS_ONLY: ${HTTPS_ONLY:-}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
      PUBLIC_PORT: ${PUBLIC_PORT:-3214}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-8}
    volumes:
      - models-data:/models
      - plugins-data:/usr/src/app/plugins
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3214/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  postgres-data:
  models-data:
  plugins-data:
