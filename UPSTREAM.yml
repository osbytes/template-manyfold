upstream_repo: manyfold3d/manyfold
version_strategy: release
pinned:
  - file: services/app/Dockerfile
    kind: from_tag
# Docker Hub tags are semver without the leading "v" from GitHub Releases
# (v0.146.0 → 0.146.0). Review upstream-check PRs and strip "v" if needed.
# postgres/redis Dockerfiles are not listed — infra cadence, not app version.
